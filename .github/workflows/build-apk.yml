name: Build DSH-Android (custom ball)

on:
  workflow_dispatch:
    inputs:
      ball_size_dp:
        description: "悬浮球直径 dp（素材有透明留白，96~120 才看得清）"
        required: true
        default: "96"
      tag:
        description: "版本名后缀"
        required: true
        default: "kcc"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 取引擎与原生库（从官方 APK）
        run: |
          set -euo pipefail
          mkdir -p toolchains/out/engine toolchains/out/jniLibs/arm64-v8a toolchains/out/third-party/assets/shizuku
          curl -L --retry 3 -o official.apk https://github.com/jackwener/DSH-Android/releases/download/v0.3.11/DSH-Android-v0.3.11-arm64.apk
          ls -l official.apk
          unzip -o -j official.apk "assets/engine*" -d toolchains/out/engine
          unzip -o -j official.apk "lib/arm64-v8a/*.so" -d toolchains/out/jniLibs/arm64-v8a
          unzip -o -j official.apk "assets/shizuku/*" -d toolchains/out/third-party/assets/shizuku
          ls -l toolchains/out/engine toolchains/out/jniLibs/arm64-v8a

      - name: 下载鲸鱼娘 GIF
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base=https://dshtui.com/pets/whale-girl-emoji/assets/gifs
          get() { curl -L --retry 4 -f -o "app/src/main/res/drawable-nodpi/$2" "$base/$1"; }
          get 01-idle.gif         ball_idle.gif
          get 08-building.gif     ball_working.gif
          get 11-notification.gif ball_attention.gif
          get 10-happy.gif        ball_happy.gif
          get 09-error.gif        ball_error.gif
          ls -l app/src/main/res/drawable-nodpi/

      - name: 换 App 图标
        run: |
          set -euo pipefail
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp "custom/ic_launcher_$d.png" "app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          rm -rf app/src/main/res/mipmap-anydpi
          ls -l app/src/main/res/mipmap-xxxhdpi/

      - name: 改代码（尺寸 / GIF 播放 / 结束表情）
        env:
          BALL_DP: ${{ inputs.ball_size_dp }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node patch_ball.js app/src/main/java/io/github/jackwener/dsh/service/FloatingBallService.kt app/build.gradle.kts
          grep -nE "setBall|flashBall|val size = \(" app/src/main/java/io/github/jackwener/dsh/service/FloatingBallService.kt

      - name: 编译
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -Pdsh.nativeOut="$PWD/toolchains/out/jniLibs" -Pdsh.engineOut="$PWD/toolchains/out/engine" -Pdsh.thirdPartyOut="$PWD/toolchains/out/third-party" -Pdsh.fetchShizuku=false

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-kcc-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
